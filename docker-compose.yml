services:
  mysql:
    image: mysql:8.4
    container_name: dexqbit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: meetup_db
      MYSQL_USER: meetup_user
      MYSQL_PASSWORD: meetup_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  seed:
    build: ./backend
    command: npm run seed
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: meetup_user
      DB_PASSWORD: meetup_password
      DB_NAME: meetup_db
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: meetup_user
      DB_PASSWORD: meetup_password
      DB_NAME: meetup_db
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-change-this-before-production}
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
